name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: mvn verify (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # GitHub runners ship Docker; Testcontainers starts its own PostgreSQL container.
      # Keycloak is NOT required: the opt-in @Tag("keycloak") test stays excluded
      # (surefire excludedGroups=keycloak) and tests use the dev key + mock JWTs.
      # decoupledx-common resolves from GitHub Packages (GPR requires auth even
      # for reading); GITHUB_TOKEN carries the needed scope inside this repo.
      - name: Configure GitHub Package credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<XML
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose GPR access (temporary)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -u "${{ github.actor }}:${GITHUB_TOKEN}" \
            https://maven.pkg.github.com/efthymiosD/decoupledx-common/com/decoupledx/decoupledx-common/0.1.0/decoupledx-common-0.1.0.pom)
          echo "GPR HTTP status for decoupledx-common-0.1.0.pom: $code"

      - name: Build and verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
